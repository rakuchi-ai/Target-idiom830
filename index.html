<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英熟語ターゲットR 1000 Web App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<style>
body{background:#f8f9fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.navbar-brand{font-weight:bold;color:#0d6efd!important}
.card-custom{border:none;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.opt-btn{text-align:left;padding:14px 18px;font-size:1.05rem;border-radius:8px;margin-bottom:10px}
.eng-text{font-size:1.4rem;font-weight:600;line-height:1.6;color:#212529}
.jp-text{font-size:1.05rem;color:#495057;margin-bottom:15px}
</style>
</head>
<body>
<nav class="navbar navbar-light bg-white border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand" href="#" onclick="showHome()"><i class="bi bi-book-half me-2"></i>英熟語ターゲットR</a>
    <div class="d-flex align-items-center">
      <button class="btn btn-outline-warning me-2" onclick="showStockList()"><i class="bi bi-star-fill me-1"></i>要復習 (<span id="stockCountNav">0</span>)</button>
      <button class="btn btn-outline-secondary" id="btnQuit" style="display:none" onclick="quitSession()"><i class="bi bi-x-circle me-1"></i>途中でやめる</button>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width:800px">
  <div id="viewHome">
    <div class="card card-custom p-4 mb-4">
      <h4 class="fw-bold mb-3"><i class="bi bi-grid-3x3-gap-fill me-2 text-primary"></i>演習セット選択 (20問ずつ)</h4>
      <p class="text-muted small mb-4" id="homeInfo">問題を読み込み中...</p>
      <div class="row row-cols-2 row-cols-md-4 g-2" id="setGrid"></div>
    </div>
    <div class="card card-custom p-4">
      <h5 class="fw-bold mb-3"><i class="bi bi-file-earmark-spreadsheet me-2 text-success"></i>外部CSVの読み込み</h5>
      <p class="text-muted small">別のCSVを一時的に使いたい場合はこちら（列: No. / 問題 / 解答 / 解説）。</p>
      <input type="file" id="csvFileInput" class="form-control" accept=".csv" onchange="handleFileUpload(event)">
    </div>
  </div>

  <div id="viewQuiz" style="display:none">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="badge bg-primary fs-6" id="quizSetLabel"></span>
      <span class="text-muted fw-bold" id="quizProgress"></span>
      <button class="btn btn-sm btn-outline-warning" id="btnToggleStock" onclick="toggleCurrentStock()"><i class="bi bi-star me-1" id="stockStarIcon"></i><span id="stockBtnText">ストック</span></button>
    </div>
    <div class="card card-custom p-4 mb-4">
      <div class="text-muted mb-1 small fw-bold" id="quizQuestionNo"></div>
      <div class="jp-text" id="quizJp"></div>
      <div class="eng-text mb-4" id="quizEng"></div>
      <div class="d-grid gap-2" id="quizOptions"></div>
      <div id="quizExplanation" class="mt-4 p-3 rounded bg-light border" style="display:none">
        <div class="fw-bold mb-2" id="quizAnsResult"></div>
        <div id="quizExpText" class="small text-secondary"></div>
        <button class="btn btn-primary mt-3 w-100" onclick="nextQuestion()">次の問題へ <i class="bi bi-arrow-right"></i></button>
      </div>
    </div>
  </div>

  <div id="viewStock" style="display:none">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="fw-bold mb-0"><i class="bi bi-star-fill text-warning me-2"></i>要復習ストック一覧</h4>
      <div>
        <button class="btn btn-sm btn-primary me-2" id="btnStartStockQuiz" onclick="startStockQuiz()">ストック問題を解く</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="showHome()">メニューへ戻る</button>
      </div>
    </div>
    <div id="stockListContainer"></div>
  </div>
</div>

<script>
// ★問題CSVのファイル名（GitHubに置いたCSVと同じ名前にしてください）
const CSV_FILE = '英熟語ターゲットR_830問.csv';
// ★ストックの保存キー（問題を入れ替えたら名前を変えると古いストックが混ざりません）
const STOCK_KEY = 'target_r_stock_idiom830';

let questionsData = [];
let stockedSet = new Set();
try { stockedSet = new Set(JSON.parse(localStorage.getItem(STOCK_KEY) || '[]')); } catch (e) {}
let currentSetQuestions = [], currentIndex = 0;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// RFC4180準拠のCSVパーサ（引用符内の改行・カンマに対応）
function parseCsvRows(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(f); f = ''; rows.push(row); row = [];
    } else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}

function parseCSV(text) {
  const rows = parseCsvRows(text).slice(1);
  const out = [];
  for (const r of rows) {
    if (r.length < 4) continue;
    const parts = r[1].replace(/\r/g, '').split('\n').map(s => s.trim()).filter(Boolean);
    let jp = '', eng = '', opts = '';
    if (parts.length >= 3) { jp = parts[0]; eng = parts[1]; opts = parts.slice(2).join(' '); }
    else { eng = parts[0] || ''; opts = parts[1] || ''; }
    const no = parseInt(r[0], 10);
    if (isNaN(no)) continue;
    out.push({ no, jp, eng, opts, ans: r[2].trim(), exp: r[3].trim() });
  }
  return out;
}

function setQuestions(list, label) {
  if (!list.length) { document.getElementById('homeInfo').textContent = '問題を読み込めませんでした。CSVの形式を確認してください。'; return false; }
  questionsData = list;
  document.getElementById('homeInfo').textContent = `全${list.length}問が20問ごとのセットに分かれています。間違えた問題は自動的に「要復習ストック」に追加されます。${label || ''}`;
  showHome();
  return true;
}

async function loadDefaultCsv() {
  try {
    const res = await fetch(encodeURI(CSV_FILE) + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    setQuestions(parseCSV(await res.text()));
  } catch (e) {
    document.getElementById('homeInfo').textContent = `「${CSV_FILE}」を読み込めませんでした (${e.message})。ファイル名・置き場所を確認するか、下の「外部CSVの読み込み」から選んでください。`;
  }
}

function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { if (setQuestions(parseCSV(e.target.result), '（外部CSV）')) alert(`${questionsData.length}問を読み込みました。`); };
  reader.readAsText(file, 'UTF-8');
}

function updateStockNav() {
  document.getElementById('stockCountNav').innerText = stockedSet.size;
  try { localStorage.setItem(STOCK_KEY, JSON.stringify([...stockedSet])); } catch (e) {}
}

function show(id) {
  ['viewHome','viewQuiz','viewStock'].forEach(v => document.getElementById(v).style.display = v === id ? 'block' : 'none');
  document.getElementById('btnQuit').style.display = id === 'viewQuiz' ? 'inline-block' : 'none';
}

function showHome() { show('viewHome'); renderSetGrid(); updateStockNav(); }

function renderSetGrid() {
  const grid = document.getElementById('setGrid'); grid.innerHTML = '';
  const total = questionsData.length, size = 20;
  for (let i = 0; i < Math.ceil(total / size); i++) {
    const start = i * size + 1, end = Math.min((i + 1) * size, total);
    const col = document.createElement('div'); col.className = 'col';
    col.innerHTML = `<button class="btn btn-outline-primary w-100 py-3" onclick="startSet(${i+1},${start},${end})"><div class="fw-bold">Set ${i+1}</div><div class="small text-muted" style="font-size:.75rem">No.${start} - ${end}</div></button>`;
    grid.appendChild(col);
  }
}

function startSet(n, s, e) {
  currentSetQuestions = questionsData.slice(s - 1, e); currentIndex = 0;
  document.getElementById('quizSetLabel').innerText = `Set ${n} (No.${s}-${e})`;
  show('viewQuiz'); renderQuestion();
}

function renderQuestion() {
  const q = currentSetQuestions[currentIndex];
  document.getElementById('quizProgress').innerText = `${currentIndex + 1} / ${currentSetQuestions.length}`;
  document.getElementById('quizQuestionNo').innerText = `No.${q.no}`;
  document.getElementById('quizJp').innerText = q.jp;
  document.getElementById('quizEng').innerText = q.eng;
  updateStockButtonState(q.no);
  const box = document.getElementById('quizOptions'); box.innerHTML = '';
  document.getElementById('quizExplanation').style.display = 'none';
  [...q.opts.matchAll(/([①②③④])\s*([^①②③④]+)/g)].forEach(m => {
    const b = document.createElement('button');
    b.className = 'btn btn-outline-dark opt-btn'; b.dataset.sym = m[1];
    b.innerHTML = `<span class="fw-bold me-2 text-primary">${m[1]}</span> ${esc(m[2].trim())}`;
    b.onclick = () => selectOption(m[1], q);
    box.appendChild(b);
  });
}

function updateStockButtonState(no) {
  const on = stockedSet.has(no);
  document.getElementById('btnToggleStock').className = on ? 'btn btn-sm btn-warning' : 'btn btn-sm btn-outline-warning';
  document.getElementById('stockStarIcon').className = on ? 'bi bi-star-fill me-1' : 'bi bi-star me-1';
  document.getElementById('stockBtnText').innerText = on ? 'ストック済み' : 'ストック';
}

function toggleCurrentStock() {
  const q = currentSetQuestions[currentIndex];
  stockedSet.has(q.no) ? stockedSet.delete(q.no) : stockedSet.add(q.no);
  updateStockButtonState(q.no); updateStockNav();
}

function selectOption(sel, q) {
  const correct = q.ans.charAt(0), ok = sel === correct;
  if (!ok) { stockedSet.add(q.no); updateStockNav(); updateStockButtonState(q.no); }
  for (const b of document.getElementById('quizOptions').children) {
    b.disabled = true;
    if (b.dataset.sym === correct) b.className = 'btn btn-success opt-btn';
    else if (b.dataset.sym === sel && !ok) b.className = 'btn btn-danger opt-btn';
  }
  document.getElementById('quizAnsResult').innerHTML = ok
    ? `<span class="text-success"><i class="bi bi-check-circle-fill me-1"></i> 正解！ (${esc(q.ans)})</span>`
    : `<span class="text-danger"><i class="bi bi-x-circle-fill me-1"></i> 不正解 (正解: ${esc(q.ans)})</span>`;
  document.getElementById('quizExpText').innerText = q.exp;
  document.getElementById('quizExplanation').style.display = 'block';
}

function nextQuestion() {
  if (++currentIndex < currentSetQuestions.length) renderQuestion();
  else { alert('このセットの学習が完了しました！'); showHome(); }
}

function quitSession() { if (confirm('途中で終了してメニューに戻りますか？')) showHome(); }

function showStockList() {
  show('viewStock');
  const c = document.getElementById('stockListContainer'); c.innerHTML = '';
  const list = questionsData.filter(q => stockedSet.has(q.no));
  document.getElementById('btnStartStockQuiz').disabled = !list.length;
  if (!list.length) { c.innerHTML = '<div class="text-center py-5 text-muted">要復習ストックに登録された問題はありません。</div>'; return; }
  list.forEach(q => {
    const d = document.createElement('div'); d.className = 'card card-custom p-3 mb-2';
    d.innerHTML = `<div class="d-flex justify-content-between align-items-start"><div>
      <span class="badge bg-secondary mb-1">No.${q.no}</span>
      <div class="fw-bold">${esc(q.eng)}</div>
      <div class="small text-muted mb-1">${esc(q.jp)}</div>
      <div class="small text-primary fw-bold">解答: ${esc(q.ans)}</div></div>
      <button class="btn btn-sm btn-outline-danger ms-2" onclick="removeStock(${q.no})">解除</button></div>`;
    c.appendChild(d);
  });
}

function removeStock(no) { stockedSet.delete(no); updateStockNav(); showStockList(); }

function startStockQuiz() {
  const list = questionsData.filter(q => stockedSet.has(q.no));
  if (!list.length) return;
  currentSetQuestions = list; currentIndex = 0;
  document.getElementById('quizSetLabel').innerText = `要復習ストック演習 (${list.length}問)`;
  show('viewQuiz'); renderQuestion();
}

updateStockNav();
loadDefaultCsv();
</script>
</body>
</html>
